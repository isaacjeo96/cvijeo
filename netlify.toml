# index.html es el CV en inglés, así que la raíz del sitio lo muestra directo.

# Ligas viejas o cortas al inglés -> raíz
[[redirects]]
  from = "/cv-en.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/en"
  to = "/"
  status = 301

# Liga corta al español (la URL se queda como /es)
[[redirects]]
  from = "/es"
  to = "/cv-es.html"
  status = 200
